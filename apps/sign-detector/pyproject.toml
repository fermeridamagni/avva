[project]
name = "sign-detector"
version = "0.1.0"
description = "A sign detector built with Mediapipe and OpenCV."
requires-python = ">=3.12"
dependencies = [
  "opencv-python==4.13.0.92",
  "mediapipe>=0.10.33,<0.11",
  "websocket-client==1.9.0",
  "python-dotenv==1.2.2"
]

[tool.uv.sources]
mediapipe = [
  { path = ".wheels/mediapipe-0.10.35-cp312-cp312-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" }
]
