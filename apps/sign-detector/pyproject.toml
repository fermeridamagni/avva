requires-python = ">=3.12"
dependencies = [
  "opencv-python==4.9.0.80",
  "mediapipe==0.10.18",
  "websocket-client==1.9.0",
  "python-dotenv==1.2.2"
]

[dependency-groups]
dev = [
    "ruff>=0.15.10",
]